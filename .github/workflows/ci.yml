name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Typecheck, Tests & Build (Node 24 / Linux)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run full Linux test suite (test/**/*.test.{ts,tsx})
        run: |
          mapfile -t test_files < <(find test -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          echo "Running ${#test_files[@]} test files..."
          ./node_modules/.bin/tsx --test "${test_files[@]}"

      - name: Next.js production build
        run: npm run build

  e2e:
    name: Playwright E2E (Node 24 / Linux)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

  secret-and-privacy-scan:
    name: Workspace Privacy & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Verify ignored/private workspace paths are untracked
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.agent-ws/|^memory/|^01_evidence/|^\.playwright-mcp/|(^|/)\.env(\.|$)|\.db$|\.tmp$' || true)
          if [ -n "$leaked" ]; then
            echo "ERROR: Forbidden workspace/private files are tracked in git:" >&2
            echo "$leaked" >&2
            exit 1
          fi

      - name: Install Gitleaks CLI v8.30.1
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan current tree for leaked secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1

      - name: Scan pull request commits for leaked secrets
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1
