# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
version: 1

reviews:
  enabled: true
  sensitivity: medium
  incremental_commits: true
  check_drafts: false
  resolve_threads_when_addressed: true
  merge_confidence_summary: true
  auto_approve_behavior: disabled
  auto_approve: disabled
  ultrareview: manual
  custom_instructions: |
    请全部使用简体中文提供审查意见。
    请遵循根目录 AGENTS.md 的安全与边界规范：
    1. 不得将 .agent-ws/、memory/、01_evidence/、真实密钥、本机路径或 SSH 地址纳入版本库；
    2. 严禁绕过 Grimoire gate 与 Warden approve（candidateSha256 一致性）直接合并任务；
    3. 严禁把 Kiro key、GitHub 凭据或开发机 SSH 地址传入沙箱容器；
    4. 对源仓库保持只读，不可在代码中引入对上游仓库的 push / PR / issue / comment 写操作。
    仅针对真实 bug、逻辑缺陷、并发或安全隐患给出可操作、尽量可直接采纳的最小修复建议。
  ignore:
    files:
      - "**/.agent-ws/**"
      - "**/memory/**"
      - "**/01_evidence/**"
      - "**/package-lock.json"
      - "**/public/monaco/**"
      - "**/.next/**"

pr_descriptions:
  generate: true
  skip_if_author_description: true
  cubic_review_link: true

issues:
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
  auto_fix: "off"
