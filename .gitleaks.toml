title = "Git-Graveyard secret scanning config"

[extend]
useDefault = true

[allowlist]
description = "Synthetic redaction/canary test fixtures, documented dummy credentials, and git internals"
paths = [
  '''^\.git/''',
  '''^test/(security|gateway|backend|exhume|git|runtime|scheduler|supervisor)/.*\.test\.ts$''',
  '''^lib/security/(canary|kiro-key-containment)\.ts$''',
]
stopwords = [
  "CANARY",
  "secret-admin-123",
  "valid-secret-code",
  "ctrl-secret-invite",
]
